name = "remotecc-relay"
main = "src/relay.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "relay.remotecc.dev", custom_domain = true }]

# One Durable Object per paired Mac ("room"). Free plan: SQLite-backed classes only.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
APNS_TEAM = "5H9G3P8QQH"
# APNS_KEY (.p8 contents) and APNS_KEY_ID are wrangler secrets (wrangler secret put), not vars — never commit them.
